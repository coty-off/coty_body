services:

  worker:
    build:
      context: .
      target: worker
    image: cr.yandex/crpst0vun14nhj0vd6po/coty-worker:latest
    env_file: .env
    volumes:
      - photos_tmp:/tmp/photos
      - ./yolo26x-pose.pt:/app/yolo26x-pose.pt:ro
    networks:
      - coty_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flower:
    build:
      context: .
      target: flower
    image: cr.yandex/crpst0vun14nhj0vd6po/coty-flower:latest
    env_file: .env
    environment:
      - FLOWER_URL_PREFIX=flower
#    ports:
#      - "5555:5555"
    networks:
      - coty_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  photos_tmp:
    external: true
    name: coty_body_api_photos_tmp

networks:
  coty_network:
    external: true
    name: coty_body_api_default